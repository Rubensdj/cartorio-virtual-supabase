<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<title>Cartório Virtual</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
<script src="supabase-umd.js"></script>
<script src="contratos.js"></script>
<style>
/* ===== PRISMATIC TOKENS ===== */
:root {
  --bg: #0a0a0a;
  --bg-gradient: linear-gradient(180deg, #050505 0%, #0a0a0a 50%, #050505 100%);
  --surface: rgba(255,255,255,0.03);
  --surface-hover: rgba(255,255,255,0.08);
  --surface-border: rgba(255,255,255,0.08);
  --accent: #b91c1c;
  --accent-dark: #991b1b;
  --gold: #d97706;
  --gold-light: #fef3c7;
  --ink: #f0f0f0;
  --ink-soft: #a0a0a0;
  --muted: #888;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow: 0 4px 16px rgba(0,0,0,0.06);
  --shadow-lg: 0 12px 40px rgba(0,0,0,0.08);
  --shadow-xl: 0 24px 64px rgba(0,0,0,0.12);
  --shadow-accent: 0 8px 32px rgba(185,28,28,0.25);
  --radius: 16px;
  --radius-lg: 24px;
  --radius-xl: 32px;
  --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  --transition-bouncy: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  --font: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
  --font-display: "Playfair Display", Georgia, serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
  line-height: 1.6;
  background: var(--bg-gradient);
}

/* ===== APP FRAME ===== */
.app-frame {
  max-width: 440px;
  margin: 0 auto;
  min-height: 100vh;
  position: relative;
  padding-bottom: 72px;
  border-left: 1px solid var(--surface-border);
  border-right: 1px solid var(--surface-border);
  background: radial-gradient(circle at top, rgba(185,28,28,0.03) 0%, transparent 50%);
}

/* ===== STATUS BAR ===== */
.status-bar {
  padding: 12px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: var(--muted);
}

.status-item {
  display: flex;
  align-items: center;
  gap: 6px;
}

.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 10px rgba(185,28,28,0.5);
  animation: pulse-dot 2s infinite;
}

@keyframes pulse-dot {
  0%, 100% { box-shadow: 0 0 0 0 rgba(185,28,28,0.4); }
  50% { box-shadow: 0 0 0 8px rgba(185,28,28,0); }
}

/* ===== APP HEADER ===== */
.app-header {
  padding: 16px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  background: rgba(10,10,10,0.8);
  backdrop-filter: blur(30px);
  border-bottom: 1px solid var(--surface-border);
  z-index: 20;
}

.app-header .logo {
  display: flex;
  align-items: center;
  gap: 10px;
}

.app-header .logo-dot {
  width: 32px;
  height: 32px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--accent), var(--gold));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  box-shadow: 0 4px 16px rgba(185,28,28,0.3);
}

.app-header .logo-text {
  font-size: 18px;
  font-weight: 700;
  font-family: var(--font-display);
  background: linear-gradient(135deg, var(--accent), var(--gold));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.app-header .actions {
  display: flex;
  align-items: center;
  gap: 16px;
}

.app-header .avatar {
  width: 36px;
  height: 36px;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--accent), var(--gold));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: var(--transition-bouncy);
  position: relative;
  overflow: hidden;
}

.app-header .avatar::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, var(--accent), var(--gold));
  background-size: 200% 200%;
  animation: shimmer 3s infinite;
  z-index: -1;
}

.app-header .avatar:hover {
  transform: scale(1.1) rotate(5deg);
  box-shadow: 0 0 25px rgba(185,28,28,0.4);
}

@keyframes shimmer {
  0%, 100% { background-position: 0 0; }
  50% { background-position: 100% 100%; }
}

/* ===== HERO ===== */
.hero-section {
  padding: 32px 20px 24px;
  text-align: center;
  position: relative;
}

.hero-section .hero-icon {
  width: 96px;
  height: 96px;
  margin: 0 auto 20px;
  border-radius: 28px;
  background: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 42px;
  box-shadow: 
    0 20px 60px rgba(185,28,28,0.3),
    0 0 0 8px rgba(255,255,255,0.1);
  animation: float 3s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

.hero-section h1 {
  font-size: 28px;
  font-weight: 800;
  font-family: var(--font-display);
  margin-bottom: 8px;
  background: linear-gradient(135deg, var(--accent), var(--gold));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.hero-section p {
  color: var(--muted);
  font-size: 14px;
  margin-bottom: 24px;
}

/* ===== BUTTONS ===== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: none;
  border-radius: var(--radius);
  font-family: var(--font);
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  transition: var(--transition);
  padding: 14px 24px;
  width: 100%;
}

.btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--accent-dark));
  color: white;
  box-shadow: var(--shadow-accent);
  border: none;
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 32px rgba(185,28,28,0.3);
}

.btn-secondary {
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--surface-border);
}

.btn-secondary:hover {
  background: var(--surface-hover);
  border-color: var(--accent);
}

.btn-ghost {
  background: transparent;
  color: var(--accent);
  border: 1px solid var(--accent);
}

.btn-ghost:hover {
  background: var(--accent);
  color: var(--bg);
}

/* ===== CARTÃO DE RELACIONAMENTO ===== */
.cartao-container {
  padding: 24px 20px;
}

.cartao-wrapper {
  position: relative;
  max-width: 360px;
  margin: 0 auto;
}

.cartao-relacionamento {
  background: linear-gradient(135deg, #1a1a1a 0%, #222222 100%);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: 
    0 20px 60px rgba(0,0,0,0.5),
    inset 0 1px 0 rgba(255,255,255,0.05);
  border: 1px solid var(--surface-border);
  min-height: 500px;
  display: flex;
  flex-direction: column;
  position: relative;
  transition: var(--transition);
}

.cartao-relacionamento:hover {
  box-shadow: 
    0 30px 80px rgba(0,0,0,0.6),
    inplace 0 0 0 0 rgba(255,255,255,0.05);
  transform: translateY(-5px);
}

.cartao-relacionamento::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 6px;
  background: linear-gradient(90deg, var(--accent), var(--gold));
}

.cartao-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px 22px 14px;
}

.cartao-logo {
  display: flex;
  align-items: center;
  gap: 10px;
}

.cartao-logo .logo-icon {
  width: 36px;
  height: 36px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--accent), var(--gold));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  box-shadow: 0 4px 16px rgba(185,28,28,0.3);
}

.cartao-logo-text {
  font-size: 15px;
  font-weight: 700;
  font-family: var(--font-display);
  color: var(--ink);
}

.cartao-level {
  font-size: 11px;
  font-weight: 700;
  padding: 6px 16px;
  border-radius: 20px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  backdrop-filter: blur(10px);
}

.level-namoro { 
  background: rgba(255,107,159,0.15); 
  color: #ff6b9d; 
  border: 1px solid rgba(255,107,159,0.3); 
}
.level-noivado { 
  background: rgba(217,119,6,0.15); 
  color: var(--gold); 
  border: 1px solid rgba(217,119,6,0.3); 
}
.level-casamento { 
  background: rgba(221,160,221,0.15); 
  color: #dda0dd; 
  border: 1px solid rgba(221,160,221,0.3); 
}
.level-uniao { 
  background: rgba(144,238,144,0.15); 
  color: #90ee90; 
  border: 1px solid rgba(144,238,144,0.3); 
}

.cartao-body {
  flex: 1;
  padding: 0 22px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 24px;
}

.cartao-names {
  text-align: center;
}

.cartao-names .nome-principal {
  font-size: 28px;
  font-weight: 800;
  font-family: var(--font-display);
  color: var(--ink);
  margin-bottom: 8px;
}

.cartao-names .coracao-container {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin: 14px 0;
}

.cartao-names .coracao {
  color: var(--accent);
  font-size: 22px;
  animation: heartbeat 1.5s ease infinite;
}

@keyframes heartbeat {
  0%, 100% { transform: scale(1); opacity: 0.8; }
  50% { transform: scale(1.2); opacity: 1; }
}

.cartao-names .nome-parceiro {
  font-size: 22px;
  font-weight: 600;
  color: var(--ink-soft);
}

.cartao-data {
  text-align: center;
  font-size: 13px;
  color: var(--muted);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}

.cartao-qr {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  padding: 12px 0;
}

.cartao-qr .qr-code {
  width: 76px;
  height: 76px;
  background: #fff;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  position: relative;
  overflow: hidden;
}

.cartao-qr .qr-code::before {
  content: '';
  position: absolute;
  inset: 4px;
  border: 2px solid var(--surface-border);
  border-radius: 10px;
}

.cartao-qr .qr-code::after {
  content: 'QR';
  font-size: 14px;
  font-weight: 700;
  color: #333;
  z-index: 1;
}

.cartao-qr .qr-info {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.cartao-qr .qr-info .qr-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-soft);
}

.cartao-qr .qr-info .qr-desc {
  font-size: 11px;
  color: var(--muted);
  font-family: 'Courier New', monospace;
}

.cartao-footer {
  padding: 20px 22px;
  border-top: 1px solid var(--surface-border);
  text-align: center;
}

.cartao-footer .motd {
  font-size: 13px;
  color: var(--muted);
  font-style: italic;
  font-family: var(--font-display);
}

.cartao-badges {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 14px;
}

.cartao-badge {
  width: 28px;
  height: 28px;
  border-radius: 10px;
  background: var(--surface);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  border: 1px solid var(--surface-border);
}

/* ===== ACTIONS ===== */
.cartao-actions {
  display: flex;
  gap: 12px;
  margin-top: 24px;
}

.cartao-actions button {
  flex: 1;
  padding: 14px;
  border: none;
  border-radius: var(--radius);
  font-weight: 600;
  font-size: 13px;
  cursor: pointer;
  transition: var(--transition-bouncy);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.action-preview {
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--surface-border);
}

.action-preview:hover {
  background: var(--surface-hover);
  border-color: var(--accent);
  transform: scale(1.05);
}

.action-download {
  background: linear-gradient(135deg, var(--accent), var(--accent-dark));
  color: white;
  border: none;
}

.action-download:hover {
  transform: scale(1.05);
  box-shadow: var(--shadow-accent);
}

/* ===== BOTTOM NAV ===== */
.bottom-nav {
  position: fixed;
  bottom: 20px;
  left: 0;
  right: 0;
  margin: 0 auto;
  max-width: 440px;
  background: rgba(10,10,10,0.7);
  backdrop-filter: blur(20px);
  border: 1px solid var(--surface-border);
  border-radius: 32px;
  padding: 8px;
  display: flex;
  justify-content: space-around;
  z-index: 30;
  box-shadow: 
    0 8px 32px rgba(0,0,0,0.3),
    inset 0 1px 0 rgba(255,255,255,0.06);
}

.bottom-nav button {
  flex: 1;
  background: none;
  border: none;
  color: var(--muted);
  padding: 10px 4px;
  font-size: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  transition: var(--transition-fast);
  border-radius: 16px;
}

.bottom-nav button.active,
.bottom-nav button:hover {
  color: var(--accent);
  background: rgba(185,28,28,0.15);
}

.bottom-nav button.active .indicator,
.bottom-nav button:hover .indicator {
  opacity: 1;
  transform: scale(1);
}

.bottom-nav .nav-icon {
  font-size: 18px;
  margin-bottom: 2px;
}

.bottom-nav .indicator {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--accent);
  opacity: 0;
  transform: scale(0);
  transition: var(--transition-fast);
}

/* ===== MODAL ===== */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.8);
  backdrop-filter: blur(16px);
  display: flex;
  align-items: flex-end;
  z-index: 100;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.3s ease;
}

.modal-overlay.active {
  opacity: 1;
  visibility: visible;
}

.modal-content {
  background: var(--bg);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-xl) var(--radius-xl) 0 0;
  padding: 24px 20px 16px;
  width: 100%;
  max-width: 440px;
  animation: slideUp 0.4s cubic-bezier(0.34,1.56,0.64,1);
  box-shadow: var(--shadow-xl);
}

@keyframes slideUp {
  from { transform: translateY(100%); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.modal-handle {
  width: 40px;
  height: 4px;
  background: var(--surface-border);
  border-radius: 2px;
  margin: 8px auto 20px;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
}

.modal-header h2 {
  font-size: 20px;
  font-weight: 700;
  font-family: var(--font-display);
}

.modal-header .close-btn {
  width: 32px;
  height: 32px;
  border-radius: 12px;
  background: var(--surface);
  border: none;
  color: var(--muted);
  font-size: 18px;
  cursor: pointer;
  transition: var(--transition-normal);
}

.modal-header .close-btn:hover {
  background: var(--surface-hover);
  color: var(--ink);
  transform: rotate(90deg);
}

.form-grid {
  display: grid;
  gap: 20px;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.form-group label {
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 6px;
}

.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  padding: 16px;
  background: var(--surface);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-sm);
  color: var(--ink);
  font-size: 16px;
  font-family: var(--font);
  transition: var(--transition-normal);
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
  outline: none;
  border-color: var(--accent);
  background: rgba(255,255,255,0.03);
  box-shadow: 0 0 0 3px rgba(185,28,28,0.1);
}

/* ===== TOAST ===== */
.toast {
  position: fixed;
  bottom: 160px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(15,15,15,0.9);
  border: 1px solid var(--surface-border);
  border-radius: 16px;
  padding: 12px 24px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  backdrop-filter: blur(20px);
  z-index: 50;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}

.toast.show {
  opacity: 1;
  pointer-events: all;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 480px) {
  .app-frame {
    border: none;
    border-radius: 0;
    max-width: 100%;
  }
  
  .hero-section .hero-icon {
    width: 80px;
    height: 80px;
    font-size: 36px;
  }
  
  .cartao-relacionamento {
    min-height: 460px;
  }
  
  .bottom-nav {
    max-width: 100%;
    margin: 0;
    border-radius: 0;
    border-radius: 24px 24px 0 0;
  }
}
</style>
</head>
<body>
<div class="app-frame">
  <!-- Status Bar -->
  <div class="status-bar">
    <div class="status-item">
      <span class="status-dot"></span>
      Online
    </div>
    <div class="status-item">Premium</div>
  </div>

  <!-- Header -->
  <header class="app-header">
    <div class="logo">
      <div class="logo-dot">💍</div>
      <span class="logo-text">Cartório Virtual</span>
    </div>
    <div class="actions">
      <div class="avatar">RP</div>
    </div>
  </header>

  <!-- Hero -->
  <section class="hero-section">
    <div class="hero-icon">💌</div>
    <h1>Cartões de Relacionamento</h1>
    <p>Transforme seu relacionamento em um documento único e exclusivo com o visual premium inspirado em carteiras de estudante</p>
  </section>

  <!-- Card Container -->
  <div class="cartao-container">
    <div class="cartao-wrapper" id="card-container">
      <!-- Card rendered by JS -->
    </div>
    
    <div class="cartao-actions">
      <button class="action-preview" onclick="showModal('creator')">
        ✏️ Editar Cartão
      </button>
      <button class="action-download" onclick="downloadPDF()">
        📄 Baixar PDF
      </button>
    </div>
  </div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <button class="active" onclick="switchTab('home')">
      <span class="nav-icon">🏠</span>
      <span>Início</span>
      <span class="indicator"></span>
    </button>
    <button onclick="switchTab('cards')">
      <span class="nav-icon">💳</span>
      <span>Cartões</span>
      <span class="indicator"></span>
    </button>
    <button onclick="switchTab('docs')">
      <span class="nav-icon">📄</span>
      <span>Documentos</span>
      <span class="indicator"></span>
    </button>
    <button onclick="switchTab('profile')">
      <span class="nav-icon">👤</span>
      <span>Perfil</span>
      <span class="indicator"></span>
    </button>
  </nav>

  <!-- Toast -->
  <div class="toast" id="toast">Cartão baixado com sucesso! 📄</div>

  <!-- Creator Modal -->
  <div id="creator-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <h2>Criar Novo Cartão</h2>
        <button class="close-btn" onclick="closeModal('creator-modal')">&times;</button>
      </div>
      <div class="form-grid">
        <div class="form-group">
          <label>Seu nome</label>
          <input type="text" id="nome1" placeholder="Digite seu nome" value="Você" />
        </div>
        <div class="form-group">
          <label>Nome do parceiro(a)</label>
          <input type="text" id="nome2" placeholder="Digite o nome do parceiro" value="Amor da minha vida" />
        </div>
        <div class="form-group">
          <label>Data de início</label>
          <input type="date" id="sinceDate" value="2023-06-15" />
        </div>
        <div class="form-group">
          <label>Nível de relacionamento</label>
          <select id="level">
            <option value="namoro">💘 Namorando</option>
            <option value="noivado" selected>💍 Noivado</option>
            <option value="casamento">👰 Casamento</option>
            <option value="uniao">🤝 União Estável</option>
          </select>
        </div>
        <div class="form-group">
          <label>Emoji do casal</label>
          <input type="text" id="emoji" placeholder="💑" value="💑" />
        </div>
        <div class="form-group">
          <label>Frase do cartão</label>
          <input type="text" id="motd" placeholder="Digite uma frase especial..." value="Juntos por decisão, unidos por escolha." />
        </div>
        <div style="display: flex; gap: 12px; margin-top: 24px;">
          <button class="btn btn-secondary" style="flex:1" onclick="closeModal('creator-modal')">Cancelar</button>
          <button class="btn btn-primary" style="flex:1" onclick="createCard()">Criar Cartão</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
let currentCard = {
  id: Date.now(),
  partner1: 'Você',
  partner2: 'Amor da minha vida',
  sinceDate: '2023-06-15',
  level: 'noivado',
  emoji: '💑',
  motd: 'Juntos por decisão, unidos por escolha.',
  badges: ['💕', '🌹', '💍']
};

const levelLabels = {
  namoro: 'Namorando',
  noivado: 'Noivado',
  casamento: 'Casados',
  uniao: 'União Estável'
};

const levelClasses = {
  namoro: 'level-namoro',
  noivado: 'level-noivado',
  casamento: 'level-casamento',
  uniao: 'level-uniao'
};

const levelBadgeClasses = {
  namoro: 'badge-namoro',
  noivado: 'badge-noivado',
  casamento: 'badge-casamento',
  uniao: 'badge-uniao'
};

function renderCard(card) {
  const container = document.getElementById('card-container');
  container.innerHTML = `
    <div class="cartao-relacionamento ${levelClasses[card.level]}">
      <div class="cartao-header">
        <div class="cartao-logo">
          <div class="logo-icon">${card.emoji}</div>
          <span class="cartao-logo-text">Cartão de Relacionamento</span>
        </div>
        <div class="cartao-level ${levelBadgeClasses[card.level]}">${levelLabels[card.level]}</div>
      </div>
      
      <div class="cartao-body">
        <div class="cartao-names">
          <div class="nome-principal">${card.partner1}</div>
          <div class="coracao-container">
            <div class="coracao">💕</div>
            <div class="coracao" style="animation-delay: 0.2s;">💕</div>
            <div class="coracao" style="animation-delay: 0.4s;">💕</div>
          </div>
          <div class="nome-parceiro">${card.partner2}</div>
        </div>
        
        <div class="cartao-data">
          💘 Juntos desde: ${new Date(card.sinceDate).toLocaleDateString('pt-BR')}
        </div>
        
        <div class="cartao-qr">
          <div class="qr-code"></div>
          <div class="qr-info">
            <div class="qr-title">ID do Par</div>
            <div class="qr-desc">${card.id.toString().slice(-8)}</div>
          </div>
        </div>
      </div>
      
      <div class="cartao-footer">
        <div class="motd">${card.motd}</div>
        <div class="cartao-badges">
          ${card.badges.map(b => `<div class="cartao-badge">${b}</div>`).join('')}
        </div>
      </div>
    </div>
  `;
}

function showModal(modalId) {
  const modal = document.getElementById(modalId);
  if (modal) {
    modal.style.display = 'block';
    setTimeout(() => modal.classList.add('active'), 10);
  }
}

function closeModal(modalId) {
  const modal = document.getElementById(modalId);
  if (modal) {
    modal.classList.remove('active');
    setTimeout(() => modal.style.display = 'none', 300);
  }
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

function createCard() {
  currentCard = {
    id: Date.now(),
    partner1: document.getElementById('nome1').value,
    partner2: document.getElementById('nome2').value,
    sinceDate: document.getElementById('sinceDate').value,
    level: document.getElementById('level').value,
    emoji: document.getElementById('emoji').value,
    motd: document.getElementById('motd').value,
    badges: currentCard.badges
  };
  renderCard(currentCard);
  closeModal('creator-modal');
  showToast('Cartão atualizado! 🎉');
}

function downloadPDF() {
  showToast('📄 PDF gerado com sucesso!');
  setTimeout(() => {
    window.print();
  }, 500);
}

function switchTab(tab) {
  const buttons = document.querySelectorAll('.bottom-nav button');
  const labels = ['Início', 'Cartões', 'Documentos', 'Perfil'];
  buttons.forEach((b, i) => {
    b.classList.toggle('active', i === ['home', 'cards', 'docs', 'profile'].indexOf(tab));
  });
}

document.addEventListener('DOMContentLoaded', () => {
  renderCard(currentCard);
});

window.onclick = function(e) {
  if (e.target.classList.contains('modal-overlay')) {
    e.target.classList.remove('active');
    setTimeout(() => e.target.style.display = 'none', 300);
  }
};
</script>
</body>
</html>
